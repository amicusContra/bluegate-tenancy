function buildMonth(year, month) {
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const startOffset = firstDay;

  const page = document.createElement('div');
  page.className = 'month-page';

  const title = document.createElement('div');
  title.className = 'month-title';
  title.innerHTML = `<span>${MONTH_NAMES[month]} ${year}</span><span class="case">26-108221-DC | Mitchell v. Smith</span>`;
  page.appendChild(title);

  const res = getResidence(year, month);
  const resDiv = document.createElement('div');
  resDiv.className = 'residence';
  resDiv.innerHTML = `
    <span class="label">DaSean:</span><span class="addr">${res.dasean}</span> |
    <span class="label">Shayla:</span><span class="addr">${res.shayla}</span> |
    <span class="label">Girls:</span><span class="addr">${res.girls}</span>
  `;
  page.appendChild(resDiv);

  const legend = document.createElement('div');
  legend.className = 'legend';
  legend.innerHTML = `
    <span><span class="swatch" style="background:#dbeafe"></span> DaSean wk</span>
    <span><span class="swatch" style="background:#fde8e8"></span> Shayla wk</span>
    <span><span class="swatch" style="background:#fffbeb"></span> Bradford</span>
    <span><span class="swatch" style="background:#f5f5f5"></span> Post-split/pre-sched</span>
    <span><span class="swatch evt-court" style="width:auto;padding:0 3px">COURT</span></span>
    <span><span class="swatch evt-serve" style="width:auto;padding:0 3px">SERVE</span></span>
    <span><span class="swatch evt-deadline" style="width:auto;padding:0 3px">DEADLINE</span></span>
    <span><span class="swatch evt-shayla" style="width:auto;padding:0 3px">Shayla</span></span>
    <span><span class="swatch evt-file" style="width:auto;padding:0 3px">DaSean/Kev</span></span>
    <span><span class="swatch evt-move" style="width:auto;padding:0 3px">MOVE</span></span>
    <span><span class="swatch evt-school" style="width:auto;padding:0 3px">School</span></span>
    <span><span class="swatch evt-senegal" style="width:auto;padding:0 3px">SENEGAL</span></span>
    <span><span class="swatch evt-question" style="width:auto;padding:0 3px">⊘ / TBD</span></span>
  `;
  page.appendChild(legend);

  const table = document.createElement('table');
  const thead = document.createElement('thead');
  const headerRow = document.createElement('tr');
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d => {
    const th = document.createElement('th');
    th.textContent = d;
    headerRow.appendChild(th);
  });
  thead.appendChild(headerRow);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  let dayCount = 1;
  const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;

  for (let i = 0; i < totalCells; i++) {
    if (i % 7 === 0) var row = document.createElement('tr');

    const td = document.createElement('td');
    if (i < startOffset || dayCount > daysInMonth) {
      td.className = 'empty';
    } else {
      const d = dayCount;
      const custody = getCustody(year, month, d);

      if (custody === 'bradford') {
        td.className = 'bradford-era';
      } else if (custody === 'pre-split') {
        td.className = 'pre-split';
      } else if (custody === 'dasean') {
        td.className = 'dasean-week';
      } else if (custody === 'shayla') {
        td.className = 'shayla-week';
      } else {
        td.className = 'pre-schedule';
      }

      const numSpan = document.createElement('span');
      numSpan.className = 'day-num';
      numSpan.textContent = d;
      td.appendChild(numSpan);

      const key = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      if (E[key]) {
        const evDiv = document.createElement('div');
        evDiv.className = 'events';
        E[key].forEach(ev => {
          if (!ev.t) return;
          const e = document.createElement('div');
          e.className = 'evt ' + ev.c;
          e.textContent = ev.t;
          e.title = ev.t;
          evDiv.appendChild(e);
        });
        td.appendChild(evDiv);
      }

      dayCount++;
    }
    row.appendChild(td);
    if (i % 7 === 6) tbody.appendChild(row);
  }
  table.appendChild(tbody);
  page.appendChild(table);

  const notes = document.createElement('div');
  notes.className = 'notes-area';
  notes.textContent = 'Notes:';
  page.appendChild(notes);

  document.body.appendChild(page);
}

MONTHS.forEach(m => buildMonth(m.year, m.month));
</script>
